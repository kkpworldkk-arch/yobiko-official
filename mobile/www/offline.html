<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滝原塾</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #05070d; color: #f6f4ee; padding: 24px; box-sizing: border-box;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; text-align: center;
  }
  .card { max-width: 340px; }
  .mark {
    width: 44px; height: 44px; margin: 0 auto 20px; border-radius: 50%;
    border: 1px solid rgba(196,160,92,.35); background: rgba(196,160,92,.08);
    display: flex; align-items: center; justify-content: center; color: #c4a05c; font-size: 20px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.7; color: #9aa3b8; margin: 0 0 28px; }
  button {
    appearance: none; border: 0; border-radius: 10px; background: #c4a05c; color: #05070d;
    font-size: 15px; font-weight: 600; padding: 13px 28px; cursor: pointer;
  }
  button:active { opacity: .8; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">塾</div>
    <h1>接続できませんでした</h1>
    <p>インターネットに接続されていないか、サーバーが混み合っています。<br>通信環境を確認して、もう一度お試しください。</p>
    <button type="button" onclick="location.href='https://takihara-app.onrender.com/login'">再読み込み</button>
  </div>
</body>
</html>
